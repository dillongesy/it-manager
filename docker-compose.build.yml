# Build the images locally instead of pulling them (development / testing a branch):
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
services:
  init:       { build: ./deploy/init }
  portal-web: { build: ./portal/frontend }
  portal-api: { build: ./portal/backend }
  field-web:  { build: ./field/frontend }
  field-api:  { build: ./field/backend }
