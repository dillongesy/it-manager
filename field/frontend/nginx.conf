# Field web container: serves the Field App and proxies /api to the Field API over the
# internal field_app network. Two listeners:
#   8080  plain HTTP for the reverse proxy, which terminates TLS for the internet: the
#         bundled Nginx Proxy Manager on the internal field_edge network, or an external
#         proxy through host port 4480, from its addresses only (PROXY_SOURCES).
#   8443  HTTPS on the office network (host port 4433 by default), with a certificate
#         from the local CA. Office addresses only (OFFICE_SOURCES, written at start-up
#         by 30-field-access.sh into /tmp/nginx). Works without any proxy set up.

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 60m;          # job photos

  # Empty with the bundled proxy; with an external reverse proxy, only its addresses.
  include /tmp/nginx/proxy-access.conf;

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $field_api http://field-api:3001;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # The Portal-to-Field service API is internal only and never served here. The Field
  # API also checks that service callers come from the bridge network.
  location ^~ /api/service { return 404; }

  location /api/ {
    proxy_pass $field_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 60m;

  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:FIELD_SSL:5m;
  ssl_session_timeout 1d;

  # Plain HTTP sent to the HTTPS port: redirect, keeping the host and port the client used.
  error_page 497 =301 https://$http_host$request_uri;

  include /tmp/nginx/office-access.conf;
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $field_api http://field-api:3001;

  location ^~ /api/service { return 404; }

  # This listener is the first hop: the client address replaces any forwarded header
  # the client sent, so the Field API cannot be given a false address.
  location /api/ {
    proxy_pass $field_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
