# Field web container: serves the Field App and proxies /api to the Field API over the
# internal field_app network. It is reached only through the reverse proxy (Nginx Proxy
# Manager) on the internal field_edge network; the proxy terminates TLS.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 60m;          # job photos

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $field_api http://field-api:3001;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # The Portal-to-Field service API is internal only and never served here. The Field
  # API also checks that service callers come from the bridge network.
  location ^~ /api/service { return 404; }

  location /api/ {
    proxy_pass $field_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
