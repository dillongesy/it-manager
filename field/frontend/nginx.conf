# Field web container. Caddy (edge) terminates TLS and forwards here over the
# internal field_edge network; /api goes on to the Field API over field_app.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 60m;          # job photos

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $field_api http://field-api:3001;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # The Portal↔Field bridge is internal-only. It is never reachable through the
  # public web entrance (the Field API also checks the caller's network).
  location ^~ /api/service { return 404; }

  location /api/ {
    proxy_pass $field_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
