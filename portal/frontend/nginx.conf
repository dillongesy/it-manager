# Portal web container: serves the Portal over HTTPS (container port 8443, published on
# host port 443; office network only) and proxies
# /api to the Portal API over the internal portal_app network.
#
# Access control (written at start-up by 30-portal-access.sh into /tmp/nginx):
#   - the networks of the Field App's entrances (PORTAL_DENIED_SOURCES: the reverse proxy
#     and field-web's office port) are always refused, so they cannot reach the Portal
#     even through the host's published port;
#   - otherwise only private and loopback addresses are allowed (PORTAL_ALLOWED_SOURCES).

# Container health check only; not published.
server {
  listen 127.0.0.1:8080;
  server_tokens off;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { return 404; }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 60m;          # customer files and order attachments are 50 MB max

  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:5m;
  ssl_session_timeout 1d;

  # Plain HTTP sent to the HTTPS port: redirect, keeping the host and port the client used.
  error_page 497 =301 https://$http_host$request_uri;

  include /tmp/nginx/portal-access.conf;
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Docker's embedded DNS; resolve at request time so nginx starts before the API.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $portal_api http://portal-api:3000;

  location /api/ {
    proxy_pass $portal_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # The local CA certificate, for installing as a trusted root on staff devices.
  location = /ca.crt {
    alias /etc/nginx/tls/ca.crt;
    default_type application/x-x509-ca-cert;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Disposition 'attachment; filename="it-manager-ca.crt"' always;
  }

  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
