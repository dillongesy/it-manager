# ──────────────────────────────────────────────────────────────────────────────
# IT Manager — the whole stack on one host.
#
#   docker compose pull && docker compose up -d      (or ./update.sh)
#
# Secrets are generated by the `init` service on first boot — there is nothing to
# fill in. Non-secret settings (sites, TLS mode, image registry) live in .env,
# written by install.sh. See README.md.
#
# Network map — every arrow is the ONLY path between those two things:
#
#   internet/LAN ─▶ edge (Caddy :80/:443/:8443)
#                    ├─ portal_edge ─▶ portal-web ─ portal_app ─▶ portal-api ─ portal_db ─▶ portal-db
#                    │                                              │  └─ portal_egress ─▶ internet (integrations)
#                    │                                              └─ bridge ─▶ field-api  (/api/service/* only)
#                    └─ field_edge  ─▶ field-web  ─ field_app  ─▶ field-api  ─ field_db  ─▶ field-db
#
#   • Every network except `public` and `portal_egress` is `internal: true` — no
#     route in or out of the host.
#   • field-db is on field_db only: reachable by field-api and nothing else.
#   • portal-api binds only its portal_app address, so field-api can't connect
#     back over the bridge; field-api answers bridge callers on /api/service/* only.
# ──────────────────────────────────────────────────────────────────────────────
name: itmanager

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app: &app
  <<: *hardening
  read_only: true
  tmpfs: ["/tmp:size=64m"]

services:
  # ── One-shot: generate + distribute secrets, then exit ───────────────────────
  init:
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org/it-manager}/init:${IMAGE_TAG:-latest}
    restart: "no"
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    volumes:
      - secrets_portal_db:/secrets/portal-db
      - secrets_portal_api:/secrets/portal-api
      - secrets_field_db:/secrets/field-db
      - secrets_field_api:/secrets/field-api
      - reveal:/reveal

  # ── Edge ─────────────────────────────────────────────────────────────────────
  edge:
    <<: *hardening
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org/it-manager}/edge:${IMAGE_TAG:-latest}
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_add: [NET_BIND_SERVICE]
    # IPv4 only on purpose: Docker's IPv6 userland proxy would hide the real client
    # address and defeat the LAN-only check.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:${FIELD_PORT:-8443}:${FIELD_PORT:-8443}"
    environment:
      PORTAL_SITE: ${PORTAL_SITE:-https://localhost}
      PORTAL_TLS: ${PORTAL_TLS:-tls internal}
      PORTAL_ALLOWED_RANGES: ${PORTAL_ALLOWED_RANGES:-private_ranges}
      FIELD_SITE: ${FIELD_SITE:-https://localhost:8443}
      FIELD_TLS: ${FIELD_TLS:-tls internal}
      FIELD_ALLOWED_RANGES: ${FIELD_ALLOWED_RANGES:-private_ranges}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [public, portal_edge, field_edge]
    depends_on:
      portal-web: { condition: service_healthy }
      field-web: { condition: service_healthy }

  # ── Portal ───────────────────────────────────────────────────────────────────
  portal-web:
    <<: *app
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org/it-manager}/portal-web:${IMAGE_TAG:-latest}
    networks: [portal_edge, portal_app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  portal-api:
    <<: *app
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org/it-manager}/portal-api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      APP_VERSION: ${IMAGE_TAG:-latest}
      # Listen ONLY on the portal_app address — unreachable from the bridge network.
      HOST: ${NET_PREFIX:-172.29}.3.10
      PORT: "3000"
      TRUST_PROXY: "2"                       # edge → portal-web → api
      DB_HOST: portal-db
      DB_NAME: portal
      DB_USER: portal
      DB_PASSWORD_FILE: /run/secrets/app/db_password
      ACCESS_TOKEN_SECRET_FILE: /run/secrets/app/access_token_secret
      REFRESH_TOKEN_SECRET_FILE: /run/secrets/app/refresh_token_secret
      ENCRYPTION_KEY_FILE: /run/secrets/app/encryption_key
      FIELD_API_URL: http://field-api:3001
      FIELD_API_TOKEN_FILE: /run/secrets/app/bridge_token
      REVEAL_DIR: /run/reveal
      CORS_ORIGIN: ${PORTAL_ORIGIN:-https://localhost}
    volumes:
      - secrets_portal_api:/run/secrets/app:ro
      - reveal:/run/reveal
      - portal_uploads:/app/uploads
    networks:
      portal_app: { ipv4_address: "${NET_PREFIX:-172.29}.3.10" }
      portal_db: {}
      bridge: {}
      portal_egress: {}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://'+process.env.HOST+':3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    depends_on:
      init: { condition: service_completed_successfully }
      portal-db: { condition: service_healthy }

  portal-db:
    <<: *hardening
    image: postgres:17-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD_FILE: /run/secrets/db/db_password
    volumes:
      - secrets_portal_db:/run/secrets/db:ro
      - portal_db_data:/var/lib/postgresql/data
    networks: [portal_db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      init: { condition: service_completed_successfully }

  # ── Field ────────────────────────────────────────────────────────────────────
  field-web:
    <<: *app
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org/it-manager}/field-web:${IMAGE_TAG:-latest}
    networks: [field_edge, field_app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  field-api:
    <<: *app
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org/it-manager}/field-api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      TRUST_PROXY: "2"
      DB_HOST: field-db
      DB_NAME: field
      DB_USER: field
      DB_PASSWORD_FILE: /run/secrets/app/db_password
      ACCESS_TOKEN_SECRET_FILE: /run/secrets/app/access_token_secret
      REFRESH_TOKEN_SECRET_FILE: /run/secrets/app/refresh_token_secret
      SERVICE_TOKEN_FILE: /run/secrets/app/service_token
      # Bridge callers must come from the bridge network, and may only use /api/service/*.
      SERVICE_ALLOWED_CIDR: ${NET_PREFIX:-172.29}.7.0/24
      CORS_ORIGIN: ${FIELD_ORIGIN:-https://localhost:8443}
      SKU_PREFIX: ${SKU_PREFIX:-INV}
    volumes:
      - secrets_field_api:/run/secrets/app:ro
      - field_uploads:/app/uploads
    networks: [field_app, field_db, bridge]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    depends_on:
      init: { condition: service_completed_successfully }
      field-db: { condition: service_healthy }

  field-db:
    <<: *hardening
    image: postgres:17-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: field
      POSTGRES_USER: field
      POSTGRES_PASSWORD_FILE: /run/secrets/db/db_password
    volumes:
      - secrets_field_db:/run/secrets/db:ro
      - field_db_data:/var/lib/postgresql/data
    networks: [field_db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U field -d field"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      init: { condition: service_completed_successfully }

networks:
  # Only `public` (edge) and `portal_egress` (integrations) can leave the host.
  public:
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.0.0/24" }] }
  portal_edge:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.1.0/24" }] }
  field_edge:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.2.0/24" }] }
  portal_app:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.3.0/24" }] }
  field_app:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.4.0/24" }] }
  portal_db:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.5.0/24" }] }
  field_db:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.6.0/24" }] }
  bridge:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.7.0/24" }] }
  portal_egress:
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.8.0/24" }] }

volumes:
  portal_db_data:
  field_db_data:
  portal_uploads:
  field_uploads:
  secrets_portal_db:
  secrets_portal_api:
  secrets_field_db:
  secrets_field_api:
  reveal:
  caddy_data:
  caddy_config:
