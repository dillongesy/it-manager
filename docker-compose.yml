# ------------------------------------------------------------------------------
# IT Manager - the complete stack on one host.
#
#   Install:  sudo ./install.sh, then finish in the browser at https://<server>
#   Update:   docker compose pull && docker compose up -d
#
# Secrets and the Portal's HTTPS certificate are generated by the `init` service on
# first start; there is nothing to fill in. Settings chosen in the setup wizard are
# written to .env (see .env.example).
#
# Two separate entrances, with no network path between them:
#
#   LAN ──────▶ :443   portal-web ─ portal_app ─▶ portal-api ─ portal_db ─▶ portal-db
#                                                   │  └─ portal_egress ─▶ internet
#                                                   └─ bridge ─▶ field-api (/api/service/* only)
#   internet ─▶ router :443 ─▶ :4443  proxy (Nginx Proxy Manager; :80, admin UI :81)
#                      └─ field_edge ─▶ field-web ─ field_app ─▶ field-api ─ field_db ─▶ field-db
#   LAN ──────▶ :4433  field-web (field_ingress; the Field App on the office network,
#                                 no proxy needed)
#
#   - The router forwards external port 443 to the server's port 4443, so internet
#     traffic reaches only the proxy, and the Portal keeps port 443 for the LAN.
#   - The proxy is attached only to field_edge, so it can reach field-web and nothing
#     on the Portal side. portal-web also refuses the proxy's network and field_ingress
#     by address, in case either is pointed at the server's own Portal port.
#   - Every network except proxy_public, portal_ingress, field_ingress and
#     portal_egress is internal (no route off the host).
#   - field-db is reachable by field-api only.
#   - portal-api listens only on its portal_app address, so field-api cannot connect
#     back over the bridge; field-api answers bridge callers on /api/service/* only.
#
# The `installer` service (profile "installer") serves the setup wizard before the
# stack is installed; install.sh starts it and the host helper stops it when done.
# ------------------------------------------------------------------------------
name: itmanager

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app: &app
  <<: *hardening
  read_only: true
  tmpfs: ["/tmp:size=64m"]

services:
  # -- One-shot: generate secrets and the Portal certificate, then exit ----------
  init:
    image: ${IMAGE_REGISTRY:-ghcr.io/dillongesy/it-manager}/init:${IMAGE_TAG:-latest}
    restart: "no"
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    environment:
      PORTAL_HOSTNAMES: ${PORTAL_HOSTNAMES:-}
    volumes:
      - secrets_portal_db:/secrets/portal-db
      - secrets_portal_api:/secrets/portal-api
      - secrets_portal_web:/secrets/portal-web
      - secrets_field_web:/secrets/field-web
      - secrets_field_db:/secrets/field-db
      - secrets_field_api:/secrets/field-api
      - pki:/pki
      - reveal:/reveal
      - host_control:/host-control

  # -- Setup wizard (before installation only) -----------------------------------
  # Started by install.sh, stopped by the host helper once the stack is installed.
  # It holds the Portal's port with the Portal's certificate, so the browser keeps the
  # same address throughout setup.
  installer:
    <<: *app
    image: ${IMAGE_REGISTRY:-ghcr.io/dillongesy/it-manager}/installer:${IMAGE_TAG:-latest}
    profiles: [installer]
    restart: "no"
    user: "1000:1000"
    network_mode: bridge
    ports:
      - "0.0.0.0:${PORTAL_PORT:-443}:8443"
    volumes:
      - secrets_portal_web:/tls:ro
      - host_control:/host-control

  # -- Portal (LAN only) --------------------------------------------------------
  portal-web:
    <<: *app
    image: ${IMAGE_REGISTRY:-ghcr.io/dillongesy/it-manager}/portal-web:${IMAGE_TAG:-latest}
    # IPv4 only: Docker's IPv6 userland proxy would hide the client address that the
    # LAN-only check relies on.
    ports:
      - "0.0.0.0:${PORTAL_PORT:-443}:8443"
    environment:
      # The Field App's entrances: the bundled proxy, field-web's office port, and an
      # external reverse proxy when one is used instead.
      PORTAL_DENIED_SOURCES: "${NET_PREFIX:-172.29}.0.0/24 ${NET_PREFIX:-172.29}.9.0/24 ${EXTERNAL_PROXY:-}"
      PORTAL_ALLOWED_SOURCES: ${PORTAL_ALLOWED_SOURCES:-}
    volumes:
      - secrets_portal_web:/etc/nginx/tls:ro
    networks: [portal_ingress, portal_app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      init: { condition: service_completed_successfully }

  portal-api:
    <<: *app
    image: ${IMAGE_REGISTRY:-ghcr.io/dillongesy/it-manager}/portal-api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      APP_VERSION: ${IMAGE_TAG:-latest}
      # Listen only on the portal_app address, which is unreachable from the bridge.
      HOST: ${NET_PREFIX:-172.29}.3.10
      PORT: "3000"
      TRUST_PROXY: "1"                       # portal-web → api
      DENIED_SOURCES: "${NET_PREFIX:-172.29}.0.0/24 ${NET_PREFIX:-172.29}.9.0/24 ${EXTERNAL_PROXY:-}"
      DB_HOST: portal-db
      DB_NAME: portal
      DB_USER: portal
      DB_PASSWORD_FILE: /run/secrets/app/db_password
      ACCESS_TOKEN_SECRET_FILE: /run/secrets/app/access_token_secret
      REFRESH_TOKEN_SECRET_FILE: /run/secrets/app/refresh_token_secret
      ENCRYPTION_KEY_FILE: /run/secrets/app/encryption_key
      FIELD_API_URL: http://field-api:3001
      FIELD_API_TOKEN_FILE: /run/secrets/app/bridge_token
      REVEAL_DIR: /run/reveal
      HOST_CONTROL_DIR: /run/host-control
    volumes:
      - secrets_portal_api:/run/secrets/app:ro
      - reveal:/run/reveal
      - host_control:/run/host-control
      - portal_uploads:/app/uploads
    networks:
      portal_app: { ipv4_address: "${NET_PREFIX:-172.29}.3.10" }
      portal_db: {}
      bridge: {}
      portal_egress: {}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://'+process.env.HOST+':3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    depends_on:
      init: { condition: service_completed_successfully }
      portal-db: { condition: service_healthy }

  portal-db:
    <<: *hardening
    image: postgres:17-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD_FILE: /run/secrets/db/db_password
    volumes:
      - secrets_portal_db:/run/secrets/db:ro
      - portal_db_data:/var/lib/postgresql/data
    networks: [portal_db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      init: { condition: service_completed_successfully }

  # -- Reverse proxy for the Field App (internet-facing) ------------------------
  # Nginx Proxy Manager, included when chosen in the setup wizard (profile "proxy",
  # enabled by COMPOSE_PROFILES in .env). Otherwise an existing reverse proxy on the
  # network forwards to field-web's proxy port (FIELD_PROXY_PORT).
  # With Nginx Proxy Manager: on the router, forward external port 443 to this host's
  # port 4443 (and external port 80 to port 80 when using HTTP certificate validation). In
  # the admin UI (http://<server>:81, LAN only) add a proxy host for the Field App domain →
  # field-web:8080 with a Let's Encrypt certificate and "Force SSL".
  proxy:
    <<: *hardening
    profiles: [proxy]
    # Follows the 2.x releases automatically. A new major version is a deliberate step:
    # Admin → System shows when one exists; then sudo ./install.sh proxy-version <major>.
    image: jc21/nginx-proxy-manager:${PROXY_TAG:-2}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SETGID, SETUID]
    environment:
      DISABLE_IPV6: "true"
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:${PROXY_HTTPS_PORT:-4443}:443"
      - "0.0.0.0:${PROXY_ADMIN_PORT:-81}:81"
    volumes:
      - proxy_data:/data
      - proxy_letsencrypt:/etc/letsencrypt
    networks: [proxy_public, field_edge]
    depends_on:
      field-web: { condition: service_healthy }

  # -- Field App ----------------------------------------------------------------
  field-web:
    <<: *app
    image: ${IMAGE_REGISTRY:-ghcr.io/dillongesy/it-manager}/field-web:${IMAGE_TAG:-latest}
    # The Field App on the office network, without the proxy: https://<server>:4433.
    # Office addresses only (nginx and the firewall); IPv4 only, as for portal-web.
    ports:
      - "0.0.0.0:${FIELD_LAN_PORT:-4433}:8443"
      # Plain HTTP for an external reverse proxy, published only when one is used
      # (FIELD_PROXY_BIND=0.0.0.0) and open only to its address (EXTERNAL_PROXY).
      - "${FIELD_PROXY_BIND:-127.0.0.1}:${FIELD_PROXY_PORT:-4480}:8080"
    environment:
      OFFICE_SOURCES: ${PORTAL_ALLOWED_SOURCES:-}
      PROXY_SOURCES: ${EXTERNAL_PROXY:-}
    volumes:
      - secrets_field_web:/etc/nginx/tls:ro
    networks: [field_ingress, field_edge, field_app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      init: { condition: service_completed_successfully }

  field-api:
    <<: *app
    image: ${IMAGE_REGISTRY:-ghcr.io/dillongesy/it-manager}/field-api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      # proxy → field-web → api. On the office port field-web is the only hop and
      # replaces X-Forwarded-For with the client's address.
      TRUST_PROXY: "2"
      DB_HOST: field-db
      DB_NAME: field
      DB_USER: field
      DB_PASSWORD_FILE: /run/secrets/app/db_password
      ACCESS_TOKEN_SECRET_FILE: /run/secrets/app/access_token_secret
      REFRESH_TOKEN_SECRET_FILE: /run/secrets/app/refresh_token_secret
      ENCRYPTION_KEY_FILE: /run/secrets/app/encryption_key
      SERVICE_TOKEN_FILE: /run/secrets/app/service_token
      # Service callers must come from the bridge network, and may only use /api/service/*.
      SERVICE_ALLOWED_CIDR: ${NET_PREFIX:-172.29}.7.0/24
      SKU_PREFIX: ${SKU_PREFIX:-INV}
    volumes:
      - secrets_field_api:/run/secrets/app:ro
      - field_uploads:/app/uploads
    networks: [field_app, field_db, bridge]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    depends_on:
      init: { condition: service_completed_successfully }
      field-db: { condition: service_healthy }

  field-db:
    <<: *hardening
    image: postgres:17-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: field
      POSTGRES_USER: field
      POSTGRES_PASSWORD_FILE: /run/secrets/db/db_password
    volumes:
      - secrets_field_db:/run/secrets/db:ro
      - field_db_data:/var/lib/postgresql/data
    networks: [field_db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U field -d field"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      init: { condition: service_completed_successfully }

networks:
  # Only proxy_public, portal_ingress, field_ingress and portal_egress can leave the host.
  proxy_public:
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.0.0/24" }] }
  portal_ingress:
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.1.0/24" }] }
  field_edge:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.2.0/24" }] }
  portal_app:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.3.0/24" }] }
  field_app:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.4.0/24" }] }
  portal_db:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.5.0/24" }] }
  field_db:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.6.0/24" }] }
  bridge:
    internal: true
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.7.0/24" }] }
  portal_egress:
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.8.0/24" }] }
  field_ingress:
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.29}.9.0/24" }] }

volumes:
  portal_db_data:
  field_db_data:
  portal_uploads:
  field_uploads:
  secrets_portal_db:
  secrets_portal_api:
  secrets_portal_web:
  secrets_field_web:
  secrets_field_db:
  secrets_field_api:
  pki:
  reveal:
  # Settings requests from the Portal to the host helper installed by install.sh.
  host_control:
  proxy_data:
  proxy_letsencrypt:
